name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

env:
  TZ: 'Asia/Tokyo'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'pnpm'
          node-version: 24

      - name: Install modules
        run: pnpm install --frozen-lockfile

      - name: Run lints
        run: |
          pnpm run gen:types
          pnpm run lint:script
          pnpm run lint:style
          pnpm run lint:markup

  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'pnpm'
          node-version: 24

      - name: Install modules
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript code
        run: |
          pnpm run gen:types
          pnpm run check:type

      - name: Run diagnostics
        run: |
          pnpm run check:astro

      - name: Check formatting
        run: pnpm run check:format

  test:
    runs-on: ubuntu-latest

    needs: [lint, check]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'pnpm'
          node-version: 24

      - name: Install modules
        run: pnpm install --frozen-lockfile

      - name: Run testing
        run: pnpm run test

  release-dry-run:
    runs-on: ubuntu-latest

    needs: [lint, check]

    if: github.event_name == 'pull_request'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          submodules: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'pnpm'
          node-version: 24

      - name: Install modules
        run: pnpm install --frozen-lockfile

      - name: Dry-run release
        # --no-ci and --branches: without them, semantic-release exits successfully without
        # running verifyConditions/analyzeCommits/generateNotes on a PR build.
        run: pnpm exec semantic-release --dry-run --no-ci --branches "$HEAD_BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.head_ref }}

  e2e:
    runs-on: ubuntu-latest

    needs: [lint, check]

    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'pnpm'
          node-version: 24

      - name: Install modules
        run: pnpm install --frozen-lockfile

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: app

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: app

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
        working-directory: app

      - name: Write E2E environment variables
        run: node -e "require('fs').writeFileSync('.dev.vars','DATABASE_URL=\"'+process.env.DATABASE_URL+'\"\n')"
        working-directory: app
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}

      - name: Run E2E tests
        run: pnpm run e2e
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}

      - name: Remove E2E environment variables
        if: ${{ always() }}
        run: rm -f .dev.vars
        working-directory: app
